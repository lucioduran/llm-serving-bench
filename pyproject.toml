[project]
name = "llm-serving-bench"
version = "0.1.0"
description = "Auditable local streaming inference measurements"
requires-python = ">=3.11"
license = "MIT"

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
[tool.mypy]
files = ["serving_bench"]
check_untyped_defs = true
ignore_missing_imports = true
[tool.coverage.run]
branch = true
source = ["serving_bench"]
[tool.coverage.report]
show_missing = true
